services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-student_web_studio}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3306:3306"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-student_web_studio}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      APP_URL: ${BACKEND_URL:-http://localhost:8000}
      APP_ENV: production
    volumes:
      - ./backend/storage:/var/www/html/storage
    ports:
      - "8000:9000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:8000/api}
      NEXT_PUBLIC_WHATSAPP: ${WHATSAPP:-6281234567890}
      NEXT_PUBLIC_EMAIL: ${EMAIL:-hello@studentwebstudio.id}
    ports:
      - "3000:3000"

volumes:
  dbdata:
